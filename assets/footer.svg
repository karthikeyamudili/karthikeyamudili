<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ftTitle ftDesc">
  <title id="ftTitle">Connect — Karthikeya Mudili</title>
  <desc id="ftDesc">Animated burgundy wave, signature, and a connect footer for mathematics, AI command engineering and corporate strategy.</desc>
  <defs>
    <linearGradient id="ft-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <linearGradient id="ft-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#451126"/><stop offset="1" stop-color="#240A16"/>
    </linearGradient>
    <linearGradient id="ft-stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B"/><stop offset=".55" stop-color="#FF4D8D"/><stop offset="1" stop-color="#FFB347"/>
    </linearGradient>
    <radialGradient id="ft-light" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C77B9B" stop-opacity=".13"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ft-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="ft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="ft-clip"><rect width="1000" height="220" rx="20"/></clipPath>
  </defs>
  <style><![CDATA[
    .ft-serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif}
    .ft-mono{font-family:'JetBrains Mono','Fira Code','Courier New',monospace}
    .ft-drift{animation:ft-drift 16s ease-in-out infinite alternate}
    .ft-node{animation:ft-pulse 3s ease-in-out infinite}
    .ft-flow{stroke-dasharray:90 840;animation:ft-flow 12s linear infinite}
    @keyframes ft-drift{from{transform:translateX(-120px)}to{transform:translateX(120px)}}
    @keyframes ft-pulse{0%,100%{opacity:.4}50%{opacity:1}}
    @keyframes ft-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-930}}
    @media (prefers-reduced-motion:reduce){.ft-drift,.ft-node,.ft-flow{animation:none}}
  ]]></style>
  <g clip-path="url(#ft-clip)">
    <rect width="1000" height="220" fill="url(#ft-bg)"/>
    <rect width="1000" height="220" fill="url(#ft-grid)"/>
    <ellipse class="ft-drift" cx="500" cy="120" rx="480" ry="180" fill="url(#ft-light)"/>

    <rect x="40" y="38" width="18" height="2" fill="#FFB347"/>
    <text class="ft-mono" x="66" y="44" font-size="11" letter-spacing="2" fill="#C77B9B">06 · CONNECT</text>
    <text class="ft-serif" x="40" y="86" font-size="32" fill="#F8F0F3">Let's build something <tspan font-style="italic" fill="#E5B5C7">worth explaining.</tspan></text>

    <path d="M40 114 C180 102 320 126 480 114 C620 104 760 124 960 112" fill="none" stroke="#701A3D" stroke-width="1.5"/>
    <path class="ft-flow" d="M40 114 C180 102 320 126 480 114 C620 104 760 124 960 112" fill="none" stroke="url(#ft-stroke)" stroke-width="2.5" stroke-linecap="round" filter="url(#ft-glow)"/>

    <text class="ft-serif" x="40" y="168" font-size="40" font-style="italic" fill="#F8F0F3">Karthikeya <tspan fill="#E5B5C7">Mudili</tspan></text>
    <text class="ft-mono" x="40" y="196" font-size="10.5" letter-spacing="1.5" fill="#C77B9B">MATHEMATICS · AI COMMAND ENGINEERING · CORPORATE STRATEGY · VISAKHAPATNAM, INDIA</text>

    <polygon points="905,116 934.4,133 934.4,167 905,184 875.6,167 875.6,133" fill="url(#ft-card)" stroke="#C77B9B" stroke-opacity=".8" stroke-width="1.2"/>
    <text class="ft-serif" x="905" y="158" font-size="22" fill="#F8F0F3" text-anchor="middle">KM</text>
    <circle class="ft-node" cx="905" cy="116" r="2.5" fill="#FF4D8D" filter="url(#ft-glow)"/>
    <circle class="ft-node" cx="934.4" cy="167" r="2.5" fill="#FFB347" style="animation-delay:1s" filter="url(#ft-glow)"/>
    <circle class="ft-node" cx="875.6" cy="167" r="2.5" fill="#FF4D8D" style="animation-delay:2s" filter="url(#ft-glow)"/>
  </g>
  <rect x=".5" y=".5" width="999" height="219" rx="20" fill="none" stroke="#701A3D" stroke-opacity=".65"/>
</svg>
