<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="tkTitle tkDesc">
  <title id="tkTitle">Toolkit and verified credentials — Karthikeya Mudili</title>
  <desc id="tkDesc">Four toolkit cards covering AI and web design, mathematics, finance and strategy, and programming; six verified credential badges.</desc>
  <defs>
    <linearGradient id="tk-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <linearGradient id="tk-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#451126"/><stop offset="1" stop-color="#240A16"/>
    </linearGradient>
    <radialGradient id="tk-light" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C77B9B" stop-opacity=".12"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tk-clip"><rect width="1000" height="620" rx="20"/></clipPath>
  </defs>
  <style><![CDATA[
    .tk-serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif}
    .tk-sans{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .tk-mono{font-family:'JetBrains Mono','Fira Code','Courier New',monospace}
    .tk-kicker{font-size:10px;letter-spacing:1.5px;fill:#FFB347}
    .tk-line{font-size:13px;fill:#E5B5C7;fill-opacity:.92}
    .tk-sub{font-size:9.5px;letter-spacing:.5px;fill:#C77B9B}
    .tk-drift{animation:tk-drift 22s ease-in-out infinite alternate}
    .tk-node{animation:tk-pulse 3s ease-in-out infinite}
    .tk-rise{animation:tk-rise .9s ease-out both}
    @keyframes tk-drift{from{transform:translateX(-150px)}to{transform:translateX(150px)}}
    @keyframes tk-pulse{0%,100%{opacity:.4}50%{opacity:1}}
    @keyframes tk-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){.tk-drift,.tk-node,.tk-rise{animation:none}}
  ]]></style>
  <g clip-path="url(#tk-clip)">
    <rect width="1000" height="620" fill="url(#tk-bg)"/>
    <ellipse class="tk-drift" cx="500" cy="300" rx="540" ry="260" fill="url(#tk-light)"/>

    <!-- 04 · TOOLKIT -->
    <rect x="40" y="38" width="18" height="2" fill="#FFB347"/>
    <text class="tk-mono" x="66" y="44" font-size="11" letter-spacing="2" fill="#C77B9B">04 · TOOLKIT</text>
    <text class="tk-serif" x="40" y="84" font-size="34" fill="#F8F0F3">The tools <tspan font-style="italic" fill="#E5B5C7">I reach for.</tspan></text>

    <g class="tk-rise">
      <rect x="40" y="104" width="450" height="120" rx="14" fill="url(#tk-card)" stroke="#701A3D"/>
      <text class="tk-mono tk-kicker" x="60" y="132">01 · AI &amp; WEB DESIGN</text>
      <text class="tk-mono" x="470" y="134" font-size="16" fill="#FFB347" text-anchor="end">›_</text>
      <text class="tk-sans tk-line" x="60" y="158">AI Command Engineering</text>
      <text class="tk-sans tk-line" x="60" y="180">Structured Prompt Architecture</text>
      <text class="tk-sans tk-line" x="60" y="202">Interactive HTML5 / CSS3 / JS Interfaces</text>
    </g>
    <g class="tk-rise" style="animation-delay:.12s">
      <rect x="510" y="104" width="450" height="120" rx="14" fill="url(#tk-card)" stroke="#701A3D"/>
      <text class="tk-mono tk-kicker" x="530" y="132">02 · MATHEMATICS</text>
      <text class="tk-mono" x="940" y="134" font-size="16" fill="#FFB347" text-anchor="end">∑</text>
      <text class="tk-sans tk-line" x="530" y="158">Calculus · Linear Algebra</text>
      <text class="tk-sans tk-line" x="530" y="180">Differential Equations</text>
      <text class="tk-sans tk-line" x="530" y="202">Probability &amp; Statistics</text>
    </g>
    <g class="tk-rise" style="animation-delay:.24s">
      <rect x="40" y="236" width="450" height="120" rx="14" fill="url(#tk-card)" stroke="#701A3D"/>
      <text class="tk-mono tk-kicker" x="60" y="264">03 · FINANCE &amp; STRATEGY</text>
      <text class="tk-mono" x="470" y="266" font-size="16" fill="#FFB347" text-anchor="end">◆</text>
      <text class="tk-sans tk-line" x="60" y="290">Financial Accounting &amp; Reporting</text>
      <text class="tk-sans tk-line" x="60" y="312">Corporate Strategy Analysis</text>
      <text class="tk-sans tk-line" x="60" y="334">Case Research</text>
    </g>
    <g class="tk-rise" style="animation-delay:.36s">
      <rect x="510" y="236" width="450" height="120" rx="14" fill="url(#tk-card)" stroke="#701A3D"/>
      <text class="tk-mono tk-kicker" x="530" y="264">04 · PROGRAMMING &amp; TOOLS</text>
      <text class="tk-mono" x="940" y="266" font-size="16" fill="#FFB347" text-anchor="end">{ }</text>
      <text class="tk-sans tk-line" x="530" y="290">Python (Harvard CS50P) · MATLAB Onramp</text>
      <text class="tk-sans tk-line" x="530" y="312">Git &amp; GitHub Pages</text>
      <text class="tk-sans tk-line" x="530" y="334">SSRN · Zenodo · ORCID</text>
    </g>

    <!-- 05 · CREDENTIALS -->
    <line x1="40" y1="380" x2="960" y2="380" stroke="#701A3D" stroke-opacity=".5"/>
    <rect x="40" y="402" width="18" height="2" fill="#FFB347"/>
    <text class="tk-mono" x="66" y="408" font-size="11" letter-spacing="2" fill="#C77B9B">05 · VERIFIED CREDENTIALS</text>
    <text class="tk-serif" x="40" y="448" font-size="34" fill="#F8F0F3">Six credentials, <tspan font-style="italic" fill="#E5B5C7">verified.</tspan></text>

    <g class="tk-rise" style="animation-delay:.1s">
      <rect x="40" y="468" width="293" height="64" rx="12" fill="url(#tk-card)" stroke="#701A3D"/>
      <text class="tk-sans" x="56" y="495" font-size="13.5" font-weight="600" fill="#F8F0F3">ICAI CA Foundation</text>
      <text class="tk-mono tk-sub" x="56" y="515">CLEARED 1ST ATTEMPT · 2023</text>
      <text class="tk-mono tk-node" x="315" y="495" font-size="12" fill="#FFB347" text-anchor="end">✓</text>
    </g>
    <g class="tk-rise" style="animation-delay:.2s">
      <rect x="353" y="468" width="293" height="64" rx="12" fill="url(#tk-card)" stroke="#701A3D"/>
      <text class="tk-sans" x="369" y="495" font-size="13.5" font-weight="600" fill="#F8F0F3">SSRN &amp; Zenodo Author</text>
      <text class="tk-mono tk-sub" x="369" y="515">PUBLISHED RESEARCH · 31+ DOWNLOADS</text>
      <text class="tk-mono tk-node" x="628" y="495" font-size="12" fill="#FFB347" text-anchor="end" style="animation-delay:.5s">✓</text>
    </g>
    <g class="tk-rise" style="animation-delay:.3s">
      <rect x="666" y="468" width="293" height="64" rx="12" fill="url(#tk-card)" stroke="#701A3D"/>
      <text class="tk-sans" x="682" y="495" font-size="13.5" font-weight="600" fill="#F8F0F3">Harvard CS50P</text>
      <text class="tk-mono tk-sub" x="682" y="515">PROGRAMMING WITH PYTHON · ACTIVE</text>
      <text class="tk-mono tk-node" x="941" y="495" font-size="12" fill="#FFB347" text-anchor="end" style="animation-delay:1s">✓</text>
    </g>
    <g class="tk-rise" style="animation-delay:.4s">
      <rect x="40" y="544" width="293" height="64" rx="12" fill="url(#tk-card)" stroke="#701A3D"/>
      <text class="tk-sans" x="56" y="571" font-size="13.5" font-weight="600" fill="#F8F0F3">MathWorks</text>
      <text class="tk-mono tk-sub" x="56" y="591">MATLAB ONRAMP · CERTIFIED</text>
      <text class="tk-mono tk-node" x="315" y="571" font-size="12" fill="#FFB347" text-anchor="end" style="animation-delay:1.5s">✓</text>
    </g>
    <g class="tk-rise" style="animation-delay:.5s">
      <rect x="353" y="544" width="293" height="64" rx="12" fill="url(#tk-card)" stroke="#701A3D"/>
      <text class="tk-sans" x="369" y="571" font-size="13.5" font-weight="600" fill="#F8F0F3">HP LIFE &amp; Outskill</text>
      <text class="tk-mono tk-sub" x="369" y="591">AI &amp; DATA SCIENCE FOUNDATIONS</text>
      <text class="tk-mono tk-node" x="628" y="571" font-size="12" fill="#FFB347" text-anchor="end" style="animation-delay:2s">✓</text>
    </g>
    <g class="tk-rise" style="animation-delay:.6s">
      <rect x="666" y="544" width="293" height="64" rx="12" fill="url(#tk-card)" stroke="#701A3D"/>
      <text class="tk-sans" x="682" y="571" font-size="13.5" font-weight="600" fill="#F8F0F3">Wharton Online</text>
      <text class="tk-mono tk-sub" x="682" y="591">CORPORATE FINANCE · 2024</text>
      <text class="tk-mono tk-node" x="941" y="571" font-size="12" fill="#FFB347" text-anchor="end" style="animation-delay:2.5s">✓</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="619" rx="20" fill="none" stroke="#701A3D" stroke-opacity=".65"/>
</svg>
